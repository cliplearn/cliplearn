<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
body {
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    cursor:pointer; user-select:none;
}
svg { display:block; }
body:hover { transform:scale(1.08); }
</style></head><body>
<svg width="24" height="24" viewBox="0 0 36 36">
    <circle cx="18" cy="18" r="18" fill="#fff"/>
    <path d="M20 8 C11 5, 5 12, 7 20 C8 25, 13 29, 20 28" stroke="#B71C1C" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    <path d="M20 10 L20 28 L27 28" stroke="#0D47A1" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
<script>
document.body.addEventListener('mouseup', (e) => {
    e.preventDefault();
    e.stopPropagation();
    if (window.electronAPI && window.electronAPI.miniClick) {
        window.electronAPI.miniClick();
    }
});
</script>
</body></html>
